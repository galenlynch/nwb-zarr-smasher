[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nwb-zarr-smasher"
description = "Generated from aind-library-template"
license = { text = "MIT" }
# dynamic-foraging-task requires >=3.11, so >=3.10 makes the tree unresolvable.
requires-python = ">=3.11"
authors = [{ name = "Allen Institute for Neural Dynamics" }]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
dynamic = ["version"]

dependencies = [
  # ---- NWB / schema ----
  "aind-data-schema",
  "pynwb",
  "hdmf-zarr",
  "neuroconv",

  # ---- data stack ----
  "pandas",
  "xarray",
  "pytz",
  "tzdata",

  # ---- ephys / spikeinterface ----
  "spikeinterface[full,widgets]",
  "wavpack-numcodecs",

  # ---- git / source installs ----
  "harp-python @ git+https://github.com/jsiegle/harp-python@decode-clock",

  # dynamic-foraging-task and ndx-pose are deliberately absent: the former pins
  # the unpublished stagewidget==1.0.5 and pynwb<3, which cannot co-resolve with
  # the latter's pynwb>=4. Both are installed with --no-deps in the capsule's
  # environment/postInstall; only foraging_gui.TransferToNWB is used. Listing
  # them here makes the tree unresolvable for everyone.

  # ---- AIND utilities ----
  "aind_dynamic_foraging_data_utils",
  "aind-ephys-utils",

  # ---- tooling with known constraints ----
  "open-ephys-python-tools<0.6.0",
  "pydantic-yaml<1.4",

  # ---- misc scientific ----
  "ibllib",
  "SimpleITK",
]

[dependency-groups]
dev = [
  "black",
  "coverage",
  "flake8",
  "interrogate",
  "isort",
  "pytest",
  "Sphinx",
  "furo",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nwb_zarr_smasher.__version__" }

[tool.black]
line-length = 79
target_version = ["py311"]
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = ["*__init__*"]
source = ["nwb_zarr_smasher", "tests"]

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "^from .* import .*",
  "^import .*",
  "pragma: no cover",
]
fail_under = 100

[tool.isort]
line_length = 79
profile = "black"
skip = [".conda"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100